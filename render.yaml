services:
  - type: web
    name: marinex-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: IS_DEMO
        value: "true"
      - key: MARINEX_DEMO_MODE
        value: "false"
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://marin-xbot.vercel.app,http://localhost:3000"
